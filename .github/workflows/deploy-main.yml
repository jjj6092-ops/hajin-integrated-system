name: Deploy to cloudtype

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudtype deployment credential
        env:
          CLOUDTYPE_TOKEN: ${{ secrets.CLOUDTYPE_TOKEN }}
        run: |
          if [ -z "$CLOUDTYPE_TOKEN" ]; then
            echo "::error::CLOUDTYPE_TOKEN is missing. Add the Cloudtype access token in repository Actions secrets."
            exit 1
          fi

      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: jjj6092/hajin-integrated-system
          stage: main
          yaml: |
            name: hajin-integrated-system
            app: dockerfile
            options:
              ports: "3000"
              dockerfile: Dockerfile
              env:
                - name: ADMIN_ID
                  value: admin
                - name: ADMIN_PASSWORD
                  value: ${{ secrets.ADMIN_PASSWORD }}
                - name: DATABASE_URL
                  value: ${{ secrets.DATABASE_URL }}
              args: []
              context:
                git:
                  url: https://github.com/${{ github.repository }}.git
                  ref: ${{ github.sha }}
